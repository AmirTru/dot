name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request cancels the older run, so minutes aren't spent on stale code.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    # Dot needs the macOS 27 SDK; GitHub's Xcode 27 image runs on macOS 27, Apple silicon.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: scripts/test.sh
      # The tests only compile the logic library; this compiles the whole app as users build it.
      - name: Build the app
        run: swift build -c release

  install-script:
    # Strangers pipe install.sh into bash, so every shell script is checked. Linux runners are
    # cheaper than macOS and come with ShellCheck.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh scripts/hooks/pre-commit
